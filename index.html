  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
        "postprocessing": "https://unpkg.com/postprocessing@6.38.2/build/index.js"

  }

<script src="https://threejs.org/build/three.min.js"></script>
 <script type="module" src="main.js" id="appScript"></script>
 <script src="https://unpkg.com/tone@latest/build/Tone.js"></script>

 <script>

let playing = false; 

async function playMelody() {

  /* HIIII */


  // CONNECT REVERB
  const reverb = new Tone.Reverb({
    decay: 5,
    wet: 0.5
  }).toDestination(); 

  // SETUP SAWTOOTH PAD SYNTH
  const chordSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" },
    envelope: {
      attack: 1.5,
      decay: 0.5,
      sustain: 0.4,
      release:1.5
    },
    volume: -12
  }).connect(reverb); 

  // ARPEGGIO SINE SYNTH
  const arpSynth = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: {
      attack: 0.1,
      decay: 0.3,
      sustain: 0.4,
      release: 1.3
    }
  }).connect(reverb);
  const pitchShift = new Tone.PitchShift({
    pitch: -12 
  }).toDestination();

  // CHORD PROGRESSIONS
  const chords = [
    ["C2", "Eb2", "G2"],   
    //["Eb2", "Gb2", "Bb2"],   
    ["B2", "D2", "F2", "A2"],   
   // ["G3", "B3", "D4", "F4"]  
  ];

  let currentChord = chords[0];

  // RANDOMLY PLAY CHORDS WITH THE SAWTOOTH PAD 
  const chordLoop = new Tone.Loop((time) => {
    currentChord = chords[Math.floor(Math.random() * chords.length)];

    chordSynth.triggerAttackRelease(currentChord, "2m", time).connect(pitchShift);
  }, "2m").start(0);

  // LOOP SOFT SINE ARPEGGIOS OF THE CURRENT RANDOM CHORD
  const arpLoop = new Tone.Loop((time) => {
    const note = currentChord[time];//Math.floor(Math.random() * currentChord.length)];

    // optional: jump up an octave sometimes
    const octaveUp = Math.random() > 0.3;
    const finalNote = octaveUp
      ? Tone.Frequency(note).transpose(12)
      : note;

    arpSynth.triggerAttackRelease(finalNote, "1n", time);
  }, "4n").start(0);

  Tone.Transport.start();
}

// click to start audio
document.addEventListener("click", async () => {
  if (!playing) {
    await Tone.start();
    playMelody();
    playing = true;
  }
});
 </script>
</script>
